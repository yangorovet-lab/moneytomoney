name: Daily articles and deploy

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:        # manual run from the Actions tab
  push:
    branches: [main]
    paths: ["content/**", "autosite/**", "site.yaml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-site
  cancel-in-progress: false

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Write new articles
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set, skipping new articles"
          else
            python -m autosite generate
          fi

      - name: Commit new articles
        if: github.event_name != 'push'
        run: |
          git config user.name "autosite-bot"
          git config user.email "autosite-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Add generated articles"
          git push

      - run: python -m autosite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: generate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
