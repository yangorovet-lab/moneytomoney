# Настройки сайта.

site:
  name: "Desk Setup Guide"
  tagline: "Practical ergonomics and gear advice for people who work from home"
  base_url: "https://yangorovet-lab.github.io/moneytomoney"
  language: "en"
  author: "Desk Setup Guide editors"
  cloudflare_analytics_token: "02de9b3550da46b988aa9db4183e2573" # счётчик посетителей Cloudflare Web Analytics (бесплатно, без cookie)
  analytics_id: ""               # или ID Google Analytics 4 (G-XXXXXXX)
  google_site_verification: ""   # код из Google Search Console (метод «HTML-тег»)
  google_verification_file: "googled07515ec93299826.html"  # или имя файла (метод «HTML-файл»)

# Партнёрские идентификаторы. Пока тег пустой, сайт работает без ссылок
# (товары упоминаются обычным текстом). Как только Amazon Associates одобрит
# заявку, впишите сюда свой тег (вида yourname-20) — ссылки появятся на всех
# страницах при следующей сборке.
affiliate:
  amazon_tag: ""

niche: >
  Home office ergonomics and equipment for remote workers: chairs, standing desks,
  monitors and monitor arms, lighting, keyboards and mice, cable management,
  and the posture and habits that prevent back, neck, wrist and eye strain.

generation:
  model: "claude-opus-5"
  effort: "medium"          # low | medium | high — выше = качественнее, но дороже
  articles_per_run: 1       # одна статья в день: ровный темп без «спама» для Google
  min_words: 900            # статьи короче уходят в черновики
  auto_publish: true        # статьи без найденных проблем публикуются сразу

# Товары. Это ссылки на категории Amazon, а не на конкретные модели: так статьи
# не зависят от наличия и характеристик отдельных товаров. {amazon_tag}
# подставляется из раздела affiliate. Можно добавлять ссылки других программ.
products:
  - id: "office-chairs"
    name: "ergonomic office chairs on Amazon"
    url: "https://www.amazon.com/s?k=ergonomic+office+chair+adjustable+lumbar&tag={amazon_tag}"
    facts: "Category link to Amazon search results, not a specific product. Do not describe specific models, prices or ratings."
    keywords: ["chair", "lumbar", "back pain", "sitting", "posture"]
  - id: "standing-desks"
    name: "electric standing desks on Amazon"
    url: "https://www.amazon.com/s?k=electric+standing+desk&tag={amazon_tag}"
